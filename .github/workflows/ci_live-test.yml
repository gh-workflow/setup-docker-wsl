name: "CI: live test"

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run super-linter
    uses: ./.github/workflows/ci_lint-super-linter.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  live-action-test:
    name: Run live action test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker in WSL on Windows
        uses: ./
        with:
          verify-docker-in-containers: "true"

      - name: Verify Docker context and engine
        shell: powershell
        run: |
          $dockerContext = docker context show
          if ($dockerContext -ne "skrog") {
            throw "Expected Docker context 'skrog', got: $dockerContext"
          }

          $dockerService = Get-Service docker -ErrorAction SilentlyContinue
          if ($dockerService -and $dockerService.Status -ne "Stopped") {
            throw "Expected Docker Engine to be stopped."
          }

          $dockerHost = docker context inspect skrog --format '{{.Endpoints.docker.Host}}'
          if ($dockerHost -ne 'npipe:////./pipe/docker_engine') {
            throw "Expected Skrog to use the standard Docker named pipe, got: $dockerHost"
          }

          $dockerOsType = docker info --format '{{.OSType}}'
          if ($dockerOsType -ne "linux") {
            throw "Expected a Linux Docker engine, got: $dockerOsType"
          }

      - name: Verify writable host bind mount
        shell: powershell
        run: |
          $mountDirectory = Join-Path $env:RUNNER_TEMP "setup-docker-wsl-bind-mount"
          $mountedFile = Join-Path $mountDirectory "container-written.txt"
          New-Item -ItemType Directory -Force -Path $mountDirectory | Out-Null

          docker run --rm `
            --mount "type=bind,src=$mountDirectory,dst=/host" `
            alpine:3.22 touch /host/container-written.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Container failed to write to the host bind mount."
          }

          if (-not (Test-Path -LiteralPath $mountedFile)) {
            throw "Container did not write the expected file to the host bind mount."
          }

      - name: Collect Docker diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Skrog status (JSON):"
          skrog status --json
          Write-Host "Docker context 'skrog':"
          docker context inspect skrog
          Write-Host "Docker daemon information:"
          docker info

  required-status-checks:
    name: "Required Status Checks" # do not change, used in ruleset "Required Status Checks"
    if: ${{ always() }}
    needs:
      - lint
      - live-action-test
    runs-on: ubuntu-latest
    steps:
      - name: Check validation job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status \
            'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$NEEDS"
